<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải Video RedNote / Xiaohongshu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h1 {
            color: #ff2442;
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }
        textarea {
            width: 100%;
            height: 90px;
            padding: 12px 16px;
            border: 1px solid #e1e1e1;
            border-radius: 12px;
            resize: none;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
            margin-bottom: 16px;
        }
        textarea:focus {
            border-color: #ff2442;
        }
        button {
            width: 100%;
            background-color: #ff2442;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e01e3a;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            text-align: left;
        }
        .error {
            background-color: #ffeef0;
            color: #ff2442;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
        }
        video {
            width: 100%;
            border-radius: 12px;
            margin-top: 12px;
            background: #000;
        }
        .download-btn {
            display: block;
            text-align: center;
            background-color: #10b981;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>RedNote Downloader</h1>
    <p class="subtitle">Dán link RedNote (Xiaohongshu) để tải video HD</p>
    
    <textarea id="urlInput" placeholder="Dán link bài viết RedNote vào đây..."></textarea>
    <button id="submitBtn" onclick="getVideo()">Lấy Video</button>

    <div id="result"></div>
</div>

<script>
    async function getVideo() {
        const input = document.getElementById('urlInput').value.trim();
        const btn = document.getElementById('submitBtn');
        const resultDiv = document.getElementById('result');

        if (!input) {
            resultDiv.innerHTML = '<div class="error">Vui lòng dán link bài viết RedNote!</div>';
            return;
        }

        btn.disabled = true;
        btn.innerText = 'Đang xử lý...';
        resultDiv.innerHTML = '';

        try {
            const response = await fetch('/api/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: input })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || 'Có lỗi xảy ra!');
            }

            resultDiv.innerHTML = `
                <p style="font-weight:600; margin-bottom:8px; color:#333;">${data.title}</p>
                <video controls src="${data.video_url}"></video>
                <a class="download-btn" href="${data.video_url}" target="_blank" download="video.mp4">Tải Video HD Về Máy</a>
            `;
        } catch (err) {
            resultDiv.innerHTML = `<div class="error">${err.message}</div>`;
        } finally {
            btn.disabled = false;
            btn.innerText = 'Lấy Video';
        }
    }
</script>

</body>
</html>
