<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedNote Downloader - Download Videos & Photos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f5f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; padding: 30px 24px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 500px; text-align: center; }
        h1 { color: #ff2442; font-size: 24px; margin-bottom: 8px; font-weight: 700; }
        p.subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        textarea { width: 100%; height: 80px; padding: 12px; border: 1px solid #e1e1e1; border-radius: 12px; resize: none; font-size: 14px; outline: none; margin-bottom: 16px; }
        textarea:focus { border-color: #ff2442; }
        button { width: 100%; background-color: #ff2442; color: white; border: none; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 12px; cursor: pointer; }
        button:disabled { background-color: #ccc; }
        #result { margin-top: 20px; text-align: left; }
        .error { background-color: #ffeef0; color: #ff2442; padding: 12px; border-radius: 10px; font-size: 14px; text-align: center; }
        video { width: 100%; border-radius: 12px; margin-top: 12px; background: #000; }
        .img-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .img-item { width: 100%; border-radius: 10px; border: 1px solid #eee; display: block; }
        .btn-action { display: block; text-align: center; background-color: #10b981; color: white; text-decoration: none; padding: 12px; border-radius: 10px; font-weight: 600; margin-top: 12px; }
        .btn-open { background-color: #2563eb; }
    </style>
</head>
<body>

<div class="card">
    <h1>RedNote Downloader</h1>
    <p class="subtitle">Dán link RedNote (Xiaohongshu) để tải Video hoặc Ảnh HD</p>
    
    <textarea id="urlInput" placeholder="Dán link bài viết RedNote vào đây..."></textarea>
    <button id="submitBtn" onclick="getMedia()">Lấy Dữ Liệu</button>

    <div id="result"></div>
</div>

<script>
    async function getMedia() {
        const input = document.getElementById('urlInput').value.trim();
        const btn = document.getElementById('submitBtn');
        const resultDiv = document.getElementById('result');

        if (!input) {
            resultDiv.innerHTML = '<div class="error">Vui lòng dán link bài viết RedNote!</div>';
            return;
        }

        btn.disabled = true;
        btn.innerText = 'Đang phân tích...';
        resultDiv.innerHTML = '';

        try {
            const response = await fetch('/api/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: input })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || 'Có lỗi xảy ra!');
            }

            if (data.type === "video" && data.video_url) {
                resultDiv.innerHTML = `
                    <video controls src="${data.video_url}"></video>
                    <a class="btn-action" href="${data.video_url}" target="_blank" rel="noreferrer">Tải Video HD Về Máy</a>
                `;
            } else if (data.type === "image" && data.images && data.images.length > 0) {
                let imgHtml = '<p style="text-align:center; font-weight:600; color:#333;">Danh sách ảnh tìm thấy (' + data.images.length + ' ảnh):</p>';
                imgHtml += '<div class="img-grid">';
                data.images.forEach((imgUrl, index) => {
                    imgHtml += `
                        <div>
                            <img class="img-item" src="${imgUrl}" alt="RedNote Image ${index + 1}">
                            <a class="btn-action" style="padding: 6px; font-size: 12px; margin-top: 4px;" href="${imgUrl}" target="_blank" rel="noreferrer">Tải Ảnh ${index + 1}</a>
                        </div>
                    `;
                });
                imgHtml += '</div>';
                resultDiv.innerHTML = imgHtml;
            } else if (data.target_url) {
                resultDiv.innerHTML = `
                    <p style="font-size:14px; color:#4b5563; margin-bottom:10px; text-align:center;">
                        Link này cần mở trực tiếp trên trình duyệt để lấy nội dung:
                    </p>
                    <a class="btn-action btn-open" href="${data.target_url}" target="_blank" rel="noreferrer">Mở Trang Gốc RedNote</a>
                `;
            } else {
                throw new Error("Không tìm thấy nội dung truyền thông hợp lệ.");
            }
        } catch (err) {
            resultDiv.innerHTML = `<div class="error">${err.message}</div>`;
        } finally {
            btn.disabled = false;
            btn.innerText = 'Lấy Dữ Liệu';
        }
    }
</script>

</body>
</html>
