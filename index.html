<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải Video RedNote</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f5f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 480px; text-align: center; }
        h1 { color: #fe2c55; margin-top: 0; font-size: 24px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        textarea { width: 100%; height: 90px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; resize: none; outline: none; font-size: 14px; }
        textarea:focus { border-color: #fe2c55; }
        button { width: 100%; background: #fe2c55; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 12px; }
        button:disabled { background: #ccc; }
        .result { margin-top: 24px; display: none; }
        video { width: 100%; border-radius: 8px; margin-top: 12px; background: #000; }
        .download-btn { display: inline-block; background: #10b981; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 10px; }
        .error { color: #dc2626; background: #fef2f2; padding: 10px; border-radius: 6px; font-size: 14px; margin-top: 12px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>RedNote Downloader</h1>
    <p>Dán link RedNote (Xiaohongshu) để tải video HD</p>
    
    <textarea id="urlInput" placeholder="Dán link RedNote vào đây..."></textarea>
    <button id="submitBtn" onclick="processDownload()">Lấy Video</button>
    
    <div id="errorBox" class="error"></div>

    <div id="resultBox" class="result">
        <h3 id="videoTitle" style="font-size: 15px; color: #333; text-align: left;"></h3>
        <video id="videoPreview" controls></video>
        <a id="downloadBtn" class="download-btn" href="#" target="_blank">Tải Video về máy</a>
    </div>
</div>

<script>
    async function processDownload() {
        const input = document.getElementById('urlInput').value.trim();
        const btn = document.getElementById('submitBtn');
        const errorBox = document.getElementById('errorBox');
        const resultBox = document.getElementById('resultBox');
        
        if (!input) {
            showError("Vui lòng nhập đường dẫn bài viết RedNote.");
            return;
        }

        errorBox.style.display = 'none';
        resultBox.style.display = 'none';
        btn.disabled = true;
        btn.innerText = "Đang xử lý...";

        try {
            const response = await fetch('/api/parse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: input })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Không thể lấy dữ liệu video.");
            }

            document.getElementById('videoTitle').innerText = data.title;
            document.getElementById('videoPreview').src = data.video_url;
            
            const proxyDownloadUrl = `/api/download?url=${encodeURIComponent(data.video_url)}&filename=${encodeURIComponent(data.title)}`;
            document.getElementById('downloadBtn').href = proxyDownloadUrl;

            resultBox.style.display = 'block';
        } catch (err) {
            showError(err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "Lấy Video";
        }
    }

    function showError(msg) {
        const errorBox = document.getElementById('errorBox');
        errorBox.innerText = msg;
        errorBox.style.display = 'block';
    }
</script>

</body>
</html>
